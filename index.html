<style>
:root{
  --black:#000;
  --gray:#f5f5f7;
  --white:#fff;
  --ink:#1d1d1f;
  --ink-2:rgba(0,0,0,.8);
  --ink-3:rgba(0,0,0,.48);
  --dark-card:#1d1d1f;
  --dark-card-2:#272729;
  --blue:#0071e3;
  --link:#0066cc;
  --link-dark:#2997ff;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --wrap:min(980px, 100% - 2.5rem);
  --wide:min(1180px, 100% - 2.5rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:48px}
body{font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.022em;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;height:48px;background:rgba(22,22,23,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:#fff}
.nav-inner{width:var(--wrap);height:100%;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.logo{font-size:17px;font-weight:600;letter-spacing:-.02em;justify-self:start;opacity:.92}
.links{display:flex;gap:clamp(1rem,3vw,2.2rem);font-size:12px;letter-spacing:-.01em}
.links a{opacity:.8;transition:opacity .2s;padding:.9rem 0}
.links a:hover{opacity:1}
.lang{justify-self:end;display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:980px;padding:2px}
.lang button{font:inherit;font-size:11px;font-weight:500;background:none;border:0;color:rgba(255,255,255,.75);padding:.25rem .65rem;border-radius:980px;cursor:pointer;min-height:24px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}
@media (max-width:767px){
  .nav{height:auto}
  .nav-inner{grid-template-columns:1fr auto;row-gap:0;padding-top:.6rem}
  .links{grid-column:1 / -1;grid-row:2;justify-content:center;gap:1.1rem;overflow-x:auto}
  .links a{padding:.7rem 0}
}

/* ---------- shared ---------- */
section{padding:clamp(5rem,11vw,8.5rem) 0}
.s-black{background:var(--black);color:#fff}
.s-gray{background:var(--gray)}
.s-white{background:var(--white)}
.head{width:var(--wrap);margin:0 auto clamp(2.5rem,6vw,4rem);text-align:center}
.eyebrow{font-size:clamp(17px,1.6vw,21px);font-weight:600;color:var(--ink-3);margin-bottom:.5rem;letter-spacing:.01em}
.s-black .eyebrow{color:#86868b}
.head h2{font-size:clamp(2.25rem,1.4rem + 3.4vw,3.5rem);font-weight:600;line-height:1.07;letter-spacing:-.015em}
.head p{max-width:40rem;margin:1.1rem auto 0;font-size:clamp(17px,1.5vw,21px);line-height:1.38;color:var(--ink-2)}
.s-black .head p{color:#a1a1a6}

.pill{display:inline-flex;align-items:center;gap:.35rem;min-height:44px;padding:0 1.35rem;border-radius:980px;font-size:17px;transition:background .2s,color .2s,border-color .2s}
.pill.fill{background:var(--blue);color:#fff}
.pill.fill:hover{background:#0077ed}
.pill.line{border:1px solid var(--blue);color:var(--blue)}
.pill.line:hover{background:var(--blue);color:#fff}
.s-black .pill.line{border-color:var(--link-dark);color:var(--link-dark)}
.s-black .pill.line:hover{background:var(--link-dark);color:#000}
.more{color:var(--link);font-size:17px}
.more:hover{text-decoration:underline}
.s-black .more{color:var(--link-dark)}
.ctas{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center}

/* ---------- hero ---------- */
.hero{background:var(--black);color:#fff;text-align:center;min-height:calc(100svh - 48px);display:grid;place-items:center;padding:6rem 1.25rem}
.hero .eyebrow{color:#86868b}
.hero h1{font-size:clamp(3rem,1rem + 8vw,6.5rem);font-weight:600;line-height:1.04;letter-spacing:-.03em}
.hero h1 span{display:block;background:linear-gradient(180deg,#fff 30%,#a1a1a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{max-width:36rem;margin:1.5rem auto 2.4rem;font-size:clamp(19px,1.9vw,24px);line-height:1.33;color:#a1a1a6}
.hero p.sub strong{color:#fff;font-weight:600}
.hero .pill.line{border-color:var(--link-dark);color:var(--link-dark)}
.hero .pill.line:hover{background:var(--link-dark);color:#000}
.hero > div{opacity:0;transform:translateY(16px);animation:up 1s cubic-bezier(.2,.7,.2,1) .1s forwards}
@keyframes up{to{opacity:1;transform:none}}

/* ---------- cards ---------- */
.cards{width:var(--wide);margin:0 auto;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media (min-width:740px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1068px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:12px;padding:2rem 1.9rem;display:flex;flex-direction:column;gap:.7rem;min-height:15rem;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px);box-shadow:rgba(0,0,0,.12) 3px 5px 30px 0}
.s-white .card{background:var(--gray)}
.card .num{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.card h3{font-size:clamp(21px,1.8vw,24px);font-weight:600;line-height:1.17;letter-spacing:-.01em}
.card p{font-size:15px;line-height:1.47;color:var(--ink-2)}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:auto;padding-top:.6rem}
.tag{font-size:12px;color:var(--ink-3);background:var(--gray);padding:.25rem .65rem;border-radius:980px}
.s-white .card .tag{background:#fff}
.card .go{color:var(--link);font-size:15px}

.all{width:var(--wrap);margin:3.5rem auto 0;text-align:center}
.all p{font-size:14px;color:var(--ink-3);margin-bottom:1rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.chips span{font-size:13px;padding:.4rem .85rem;border-radius:980px;background:#fff;color:var(--ink-2)}

.note{width:var(--wrap);margin:2.25rem auto 0;text-align:center;font-size:15px;color:var(--ink-3)}
.note a{color:var(--link)}
.note a:hover{text-decoration:underline}

/* ---------- nft ---------- */
.nft-grid{width:var(--wide);margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(.6rem,1.4vw,1.1rem)}
@media (min-width:740px){.nft-grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1068px){.nft-grid{grid-template-columns:repeat(4,1fr)}}
.nft{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--dark-card)}
.nft img,.nft .ph{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.nft:hover img,.nft:hover .ph{transform:scale(1.04)}
.ph{display:grid;place-items:center;font-size:clamp(2rem,5vw,3.2rem);font-weight:600;letter-spacing:-.03em;color:#424245;background:linear-gradient(160deg,#2a2a2d,#161617)}
.nft figcaption{position:absolute;left:0;right:0;bottom:0;padding:1rem;font-size:13px;color:#f5f5f7;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.nft-links{margin-top:3rem}

/* ---------- ai ---------- */
.people{width:var(--wrap);margin:0 auto;display:grid;grid-template-columns:1fr;gap:1.25rem}
@media (min-width:740px){.people{grid-template-columns:repeat(3,1fr)}}
.person{background:#fff;border-radius:12px;padding:2.4rem 1.5rem 2rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.4rem;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
a.person:hover{transform:translateY(-4px);box-shadow:rgba(0,0,0,.12) 3px 5px 30px 0}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:600;color:#fff;background:linear-gradient(160deg,#3a3a3c,#1d1d1f);margin-bottom:.9rem}
.person h3{font-size:21px;font-weight:600;line-height:1.19}
.person p{font-size:15px;color:var(--ink-3)}
.person .more{font-size:15px;margin-top:.6rem}
.ai-intro{width:var(--wrap);margin:3rem auto 0;text-align:center;font-size:15px;color:var(--ink-3)}

/* ---------- kick ---------- */
.kick{text-align:center}
.kick .handle{font-size:clamp(2.4rem,1rem + 6vw,5.5rem);font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:0 auto 2.2rem;width:var(--wrap)}
.kick .handle span{color:#86868b;display:inline-block}
@media (max-width:480px){.kick .handle{font-size:clamp(2rem,10vw,2.6rem)}}

/* ---------- contact ---------- */
.contact{text-align:center}
.contact .ctas{width:var(--wrap);margin:0 auto}

footer{background:var(--gray);border-top:1px solid #d2d2d7}
footer div{width:var(--wrap);margin:0 auto;padding:1.1rem 0;font-size:12px;color:var(--ink-3);text-align:center}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv,.hero > div{opacity:1;transform:none}
}
</style>
</head>

    gh_title:"Open-source projects.",
    gh_desc:"This list is pulled live from GitHub, so new repos show up here automatically.",
    gh_loading:"Loading repos…", gh_error:"Couldn't load repos right now.", gh_all:"All repos on GitHub ›",
    gh_setup:"Set your GitHub username in CONFIG.", gh_empty:"No public repos yet.", gh_nodesc:"No description.", updated:"Updated",
    nft_title:"Hand-drawn characters.",
    nft_desc:"My collection of hand-designed characters. No AI, no templates; every line is mine.",
    ai_eyebrow:"AI content",
    ai_title:"Characters that post every day.",
    ai_desc:"I run AI character accounts that post daily on Instagram and TikTok.",
    ai_intro:"I create the characters with Higgsfield and handle scripting, editing and the posting plan.",
    kick_title:"Live on Kick.", kick_desc:"Chats, gaming and development sessions. Follow the channel to get notified when I go live.",
    kick_btn:"Go to channel",
    contact_kicker:"Contact", contact_title:"Got a project?<br>Let's talk.",
    view:"View ›", profile:"View profile ›"
  }
};

let lang = "tr";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t = k => I18N[lang][k] ?? k;
let ghRepos = null, ghState = "loading";

function renderFivem(){
  $("#fivem-grid").innerHTML = CONFIG.fivemScripts.map((s,i) => {
    const tag = s.url ? "a" : "div";
    const attrs = s.url ? `href="${esc(s.url)}" target="_blank" rel="noopener"` : "";
    return `<${tag} class="card" ${attrs}>
      <span class="num">${String(i+1).padStart(2,"0")}</span>
      <h3>${esc(s.name)}</h3>
      <p>${esc(s[lang])}</p>
      <div class="tags">${s.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
      ${s.url ? `<span class="go">${t("view")}</span>` : ""}
    </${tag}>`;
  }).join("");
  $("#all-label").textContent = t("all_label").replace("{n}", CONFIG.allScripts.length);
  $("#all-chips").innerHTML = CONFIG.allScripts.map(n => `<span>${esc(n)}</span>`).join("");
}

async function loadGithub(){
  const u = CONFIG.githubUsername;
  if (!u){ ghState = "setup"; renderGithub(); return; }
  try{
    const r = await fetch(`https://api.github.com/users/${encodeURIComponent(u)}/repos?per_page=100&sort=updated`);
    if (!r.ok) throw new Error(r.status);
    let data = await r.json();
    if (CONFIG.githubHideForks) data = data.filter(x => !x.fork);
    data.sort((a,b) => (b.stargazers_count - a.stargazers_count) || (new Date(b.pushed_at) - new Date(a.pushed_at)));
    ghRepos = data.slice(0, 9);
    ghState = ghRepos.length ? "ok" : "empty";
  }catch(e){ ghState = "error"; }
  renderGithub();
}

function renderGithub(){
  const grid = $("#gh-grid"), note = $("#gh-note"), u = CONFIG.githubUsername;
  const profile = `https://github.com/${encodeURIComponent(u)}`;
  if (ghState !== "ok"){
    grid.innerHTML = ""; grid.style.display = "none";
    const msg = {loading:t("gh_loading"), error:t("gh_error"), setup:t("gh_setup"), empty:t("gh_empty")}[ghState];
    note.innerHTML = esc(msg) + (ghState === "error" || ghState === "empty" ? ` <a href="${profile}" target="_blank" rel="noopener">${t("gh_all")}</a>` : "");
    return;
  }
  grid.style.display = "";
  const fmt = new Intl.DateTimeFormat(lang === "tr" ? "tr-TR" : "en-GB", {month:"short", year:"numeric"});
  grid.innerHTML = ghRepos.map(r => `
    <a class="card" href="${esc(r.html_url)}" target="_blank" rel="noopener">
      <span class="num">${t("updated")} ${fmt.format(new Date(r.pushed_at))}${r.stargazers_count ? ` · ★ ${r.stargazers_count}` : ""}</span>
      <h3>${esc(r.name)}</h3>
      <p>${esc(r.description || t("gh_nodesc"))}</p>
      <div class="tags">${r.language ? `<span class="tag">${esc(r.language)}</span>` : ""}${(r.topics||[]).slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>
    </a>`).join("");
  note.innerHTML = `<a href="${profile}" target="_blank" rel="noopener">${t("gh_all")}</a>`;
}

function renderNft(){
  $("#nft-grid").innerHTML = CONFIG.nfts.map((n,i) => {
    const media = n.img
      ? `<img src="nft/${esc(n.img)}" alt="${esc(n.name)}" loading="lazy" decoding="async">`
      : `<div class="ph">${String(i+1).padStart(2,"0")}</div>`;
    return `<figure class="nft">${media}<figcaption>${esc(n.name)}</figcaption></figure>`;
  }).join("");
  $("#nft-links").innerHTML = CONFIG.nftLinks.map((l,i) =>
    `<a class="pill ${i ? "line" : "fill"}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label[lang])}</a>`).join("");
}

function renderAi(){
  $("#ai-list").innerHTML = CONFIG.aiCharacters.map(c => {
    const tag = c.url ? "a" : "div";
    const attrs = c.url ? `href="${esc(c.url)}" target="_blank" rel="noopener"` : "";
    const initials = c.name.split(/\s|\|/).filter(Boolean).slice(0,2).map(w=>w[0]).join("");
    return `<${tag} class="person" ${attrs}>
      <span class="avatar">${esc(initials)}</span>
      <h3>${esc(c.name)}</h3><p>${esc(c[lang])}</p>
      ${c.url ? `<span class="more">${t("profile")}</span>` : ""}
    </${tag}>`;
  }).join("");
}

function renderKick(){
  $("#kick-btn").href = `https://kick.com/${CONFIG.kickHandle}`;
  $("#kick-handle").textContent = CONFIG.kickHandle;
}

function renderContact(){
  const all = [
    ...CONFIG.emails.map(e => ({label: e, url: "mailto:" + e, fill: true})),
    ...CONFIG.socials,
    {label: "Kick", url: `https://kick.com/${CONFIG.kickHandle}`},
    ...(CONFIG.githubUsername ? [{label: "GitHub", url: `https://github.com/${CONFIG.githubUsername}`}] : []),
  ];
  $("#contact-links").innerHTML = all.map(l =>
    `<a class="pill ${l.fill ? "fill" : "line"}" href="${esc(l.url)}" ${l.url.startsWith("mailto:") ? "" : 'target="_blank" rel="noopener"'}>${esc(l.label)}</a>`).join("");
}

function applyLang(next){
  lang = next;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.title = lang === "tr" ? "Yusuf Kaan Çelik — Portfolyo" : "Yusuf Kaan Çelik — Portfolio";
  renderFivem(); renderGithub(); renderNft(); renderAi();
  try{ localStorage.setItem("lang", lang); }catch(e){}
}

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
$("#year").textContent = new Date().getFullYear();

let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(e){}
renderKick(); renderContact();
applyLang(saved || ((navigator.language || "tr").toLowerCase().startsWith("tr") ? "tr" : "en"));
loadGithub();

const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}), {threshold:.12}) : null;
document.querySelectorAll(".rv").forEach(el => io ? io.observe(el) : el.classList.add("in"));
</script>
</body>
</html>
